<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição — Oficina de Estratégia · Estúdio Kata</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://use.typekit.net">
  <link rel="preconnect" href="https://p.typekit.net">
  <link rel="stylesheet" href="https://use.typekit.net/akq5qpv.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .checkout-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .checkout-main {
      flex: 1;
      padding: 48px 100px 80px;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    .checkout-header {
      margin-bottom: 40px;
    }
    .checkout-label {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 8px;
    }
    .checkout-title {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: var(--text);
      margin: 0;
    }
    #checkout-container {
      min-height: 400px;
    }
    .checkout-error {
      display: none;
      padding: 16px;
      background: #fff0ee;
      border-left: 3px solid var(--orange);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      margin-top: 24px;
    }
    @media (max-width: 768px) {
      .checkout-main {
        padding: 32px 24px 60px;
      }
      .checkout-title {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="page-transition" id="page-transition" aria-hidden="true"></div>
  <div class="menu-backdrop" id="menu-backdrop" aria-hidden="true"></div>

  <div class="menu-overlay" id="menu-overlay" role="dialog" aria-modal="true" aria-label="Menu de navegação">
    <div class="menu-overlay__header">
      <a href="/" class="menu-overlay__logo" aria-label="Estúdio Kata — ir para home">
        <img src="assets/logo.svg" alt="Estúdio Kata">
      </a>
      <button class="menu-overlay__close" id="menu-close" aria-label="Fechar menu">FECHAR</button>
    </div>
    <div class="menu-overlay__body">
      <div class="menu-overlay__nav-col">
        <span class="menu-overlay__label" aria-hidden="true">MENU</span>
        <nav class="menu-overlay__nav" aria-label="Navegação principal">
          <a href="/" class="menu-overlay__link">Início</a>
          <a href="/formacoes" class="menu-overlay__link">Formações</a>
          <a href="/repertorio" class="menu-overlay__link">Nosso repertório</a>
          <a href="/manifesto" class="menu-overlay__link">Manifesto</a>
        </nav>
      </div>
      <div class="menu-overlay__contact">
        <a href="mailto:contato@estudiokata.com" class="menu-overlay__email">contato@estudiokata.com</a>
        <div class="menu-overlay__social">
          <a href="https://linkedin.com/company/estudiokata" target="_blank" rel="noopener noreferrer" class="menu-overlay__social-btn" aria-label="LinkedIn">
            <img src="assets/icon-linkedin.svg" alt="LinkedIn">
          </a>
          <a href="https://www.instagram.com/estudio.kata/" target="_blank" rel="noopener noreferrer" class="menu-overlay__social-btn" aria-label="Instagram">
            <img src="assets/icon-instagram.svg" alt="Instagram">
          </a>
          <a href="https://wa.me/5511976139278" target="_blank" rel="noopener noreferrer" class="menu-overlay__social-btn" aria-label="WhatsApp">
            <img src="assets/icon-whatsapp.svg" alt="WhatsApp">
          </a>
        </div>
      </div>
    </div>
  </div>

  <nav class="nav">
    <a href="/" class="nav__logo" aria-label="Estúdio Kata — ir para home">
      <img src="assets/logo.svg" alt="Estúdio Kata">
    </a>
    <button class="nav__menu" id="menu-open" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-overlay">MENU</button>
  </nav>

  <div class="checkout-wrap">
    <main class="checkout-main">
      <div class="checkout-header">
        <p class="checkout-label">Oficina de Estratégia</p>
        <h1 class="checkout-title">Finalize sua inscrição</h1>
      </div>
      <div id="checkout-container"></div>
      <div class="checkout-error" id="checkout-error" role="alert"></div>
    </main>
  </div>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    /* ─── PAGE TRANSITION ───────────────────────────── */
    const pt = document.getElementById('page-transition');
    document.querySelectorAll('a[href]').forEach(link => {
      const href = link.getAttribute('href');
      if (href && !href.startsWith('http') && !href.startsWith('mailto') && !href.startsWith('tel') && !href.startsWith('#')) {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          pt.style.pointerEvents = 'all';
          pt.style.animation = 'none';
          requestAnimationFrame(() => {
            pt.style.animation = 'pt-cover 0.7s cubic-bezier(0.76, 0, 0.24, 1) forwards';
            pt.addEventListener('animationend', () => { window.location.href = href; }, { once: true });
          });
        });
      }
    });

    /* ─── MENU OVERLAY ───────────────────────────────── */
    const menuOverlay  = document.getElementById('menu-overlay');
    const menuBackdrop = document.getElementById('menu-backdrop');
    const menuOpen     = document.getElementById('menu-open');
    const menuClose    = document.getElementById('menu-close');

    function openMenu() {
      menuOverlay.classList.add('is-open');
      menuBackdrop.classList.add('is-open');
      menuOpen.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
      menuOverlay.classList.remove('is-open');
      menuBackdrop.classList.remove('is-open');
      menuOpen.setAttribute('aria-expanded', 'false');
    }

    menuOpen.addEventListener('click', openMenu);
    menuClose.addEventListener('click', closeMenu);
    menuBackdrop.addEventListener('click', closeMenu);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menuOverlay.classList.contains('is-open')) closeMenu();
    });

    document.querySelector('.menu-overlay__email').addEventListener('click', (e) => {
      e.preventDefault();
      const el = e.currentTarget;
      const original = el.textContent;
      navigator.clipboard.writeText('contato@estudiokata.com');
      el.textContent = 'Copiado!';
      setTimeout(() => { el.textContent = original; }, 1500);
    });

    /* ─── NAV: some ao scrollar ─────────────────────── */
    const nav = document.querySelector('.nav');
    function setNavVar() {
      document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
    }
    setNavVar();
    window.addEventListener('resize', setNavVar);
    window.addEventListener('scroll', () => {
      nav.classList.toggle('is-hidden', window.scrollY > 10);
    }, { passive: true });

    /* ─── STRIPE EMBEDDED CHECKOUT ───────────────────── */
    (async () => {
      const stripe = Stripe('pk_test_51TZGChA192J4BKrXXrWAkByWiomJtjU1AHgVSNOv9QNXL53k2ayWD70EVgMgUdLTCIzKxQJLT3Kbqh7vSx1fhvWX0022NYqPoF');
      const errorEl = document.getElementById('checkout-error');

      try {
        const checkout = await stripe.initEmbeddedCheckout({
          fetchClientSecret: async () => {
            const res = await fetch('/api/checkout', { method: 'POST' });
            if (!res.ok) throw new Error('Erro ao iniciar checkout.');
            const { clientSecret, error } = await res.json();
            if (error) throw new Error(error);
            return clientSecret;
          }
        });
        checkout.mount('#checkout-container');
      } catch (err) {
        errorEl.textContent = 'Não foi possível carregar o checkout. Tente novamente ou entre em contato: contato@estudiokata.com';
        errorEl.style.display = 'block';
      }
    })();
  </script>

</body>
</html>
