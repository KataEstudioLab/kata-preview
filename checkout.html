<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição — Oficina de Estratégia · Estúdio Kata</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://use.typekit.net">
  <link rel="preconnect" href="https://p.typekit.net">
  <link rel="stylesheet" href="https://use.typekit.net/akq5qpv.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      min-height: 100vh;
      font-family: 'redonda', sans-serif;
      background: #fffffa;
    }

    /* ── Painel esquerdo ── */
    .co-left {
      flex: 0 0 52%;
      background: #fffffa;
      padding: 104px 80px 80px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .co-logo {
      display: block;
      margin-bottom: 40px;
      line-height: 0;
      flex-shrink: 0;
    }
    .co-logo img {
      height: 32px;
      width: auto;
    }

    .co-title {
      font-size: 32px;
      font-weight: 300;
      color: #1e1a17;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .co-date {
      font-size: 16px;
      font-weight: 300;
      color: #1e1a17;
      line-height: 1.5;
    }

    /* ── Painel direito ── */
    .co-right {
      flex: 0 0 48%;
      background: #ffffff;
      box-shadow: 0px 8px 16px 0px rgba(18, 18, 18, 0.12);
      min-height: 100vh;
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
    }

    #checkout-container {
      flex: 1;
    }

    .co-error {
      display: none;
      padding: 16px;
      background: #fff0ee;
      border-left: 3px solid #e25c2e;
      color: #1e1a17;
      font-size: 15px;
      line-height: 1.5;
      margin-top: 24px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      body { flex-direction: column; }

      .co-left {
        flex: none;
        min-height: auto;
        padding: 48px 24px 40px;
      }

      .co-right {
        flex: 1;
        min-height: auto;
        padding: 40px 24px 60px;
        box-shadow: none;
        border-top: 1px solid rgba(18,18,18,0.08);
      }
    }
  </style>
</head>
<body>

  <div class="co-left">
    <a href="/" class="co-logo" aria-label="Estúdio Kata — ir para home">
      <img src="assets/logo.svg" alt="Estúdio Kata">
    </a>
    <h1 class="co-title">Oficina de Estratégia</h1>
    <p class="co-date">01 de Agosto de 2026</p>
  </div>

  <div class="co-right">
    <div id="checkout-container"></div>
    <div class="co-error" id="checkout-error" role="alert"></div>
  </div>

  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script>
    (async () => {
      const errorEl = document.getElementById('checkout-error');

      try {
        const res = await fetch('/api/checkout', { method: 'POST' });
        if (!res.ok) throw new Error('Erro ao iniciar checkout.');
        const { preferenceId, amount, error } = await res.json();
        if (error) throw new Error(error);

        const mp = new MercadoPago('TEST-1ccf4952-1d12-4c32-9968-e3ce1d92c11d', { locale: 'pt-BR' });
        const bricks = mp.bricks();

        await bricks.create('payment', 'checkout-container', {
          initialization: { amount, preferenceId },
          customization: {
            paymentMethods: {
              creditCard: 'all',
              debitCard: 'all',
              ticket: 'all',
              bankTransfer: 'all',
            },
          },
          callbacks: {
            onReady: () => {},
            onSubmit: ({ formData }) => {
              return new Promise((resolve, reject) => {
                fetch('/api/process-payment', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(formData),
                })
                  .then(r => r.json())
                  .then(data => {
                    if (data.status === 'approved' || data.status === 'pending') {
                      window.location.href = '/obrigado';
                    } else {
                      errorEl.textContent = 'Pagamento não aprovado. Verifique os dados e tente novamente.';
                      errorEl.style.display = 'block';
                    }
                    resolve();
                  })
                  .catch(reject);
              });
            },
            onError: (err) => { console.error(err); },
          },
        });
      } catch (err) {
        errorEl.textContent = 'Não foi possível carregar o checkout. Tente novamente ou entre em contato: contato@estudiokata.com';
        errorEl.style.display = 'block';
      }
    })();
  </script>

</body>
</html>
