<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição — Oficina de Estratégia · Estúdio Kata</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://use.typekit.net">
  <link rel="preconnect" href="https://p.typekit.net">
  <link rel="stylesheet" href="https://use.typekit.net/akq5qpv.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f6f9fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .co-logo-bar {
      padding: 20px 48px;
    }
    .co-logo-bar a {
      display: inline-block;
      line-height: 0;
    }
    .co-logo-bar img {
      height: 28px;
      width: auto;
    }

    .co-body {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0 24px 60px;
    }

    #checkout-container {
      width: 100%;
      max-width: 1000px;
    }

    .co-error {
      display: none;
      max-width: 560px;
      margin: 40px auto;
      padding: 16px 20px;
      background: #fff0ee;
      border-left: 3px solid #e25c2e;
      color: #1a1a1a;
      font-size: 15px;
      line-height: 1.5;
      border-radius: 4px;
    }

    .co-footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #8898aa;
    }
    .co-footer a {
      color: #8898aa;
      text-decoration: none;
    }
    .co-footer a:hover { text-decoration: underline; }

    @media (max-width: 560px) {
      .co-logo-bar { padding: 16px 20px; }
    }
  </style>
</head>
<body>

  <div class="co-logo-bar">
    <a href="/" aria-label="Estúdio Kata — ir para home">
      <img src="assets/logo.svg" alt="Estúdio Kata" height="28">
    </a>
  </div>

  <div class="co-body">
    <div id="checkout-container"></div>
    <div class="co-error" id="checkout-error" role="alert"></div>
  </div>

  <footer class="co-footer">
    <a href="/" >← Voltar</a>
  </footer>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    (async () => {
      const stripe = Stripe('pk_test_51TZGChA192J4BKrXXrWAkByWiomJtjU1AHgVSNOv9QNXL53k2ayWD70EVgMgUdLTCIzKxQJLT3Kbqh7vSx1fhvWX0022NYqPoF');
      const errorEl = document.getElementById('checkout-error');

      try {
        const checkout = await stripe.initEmbeddedCheckout({
          fetchClientSecret: async () => {
            const res = await fetch('/api/checkout', { method: 'POST' });
            if (!res.ok) throw new Error('Erro ao iniciar checkout.');
            const { clientSecret, error } = await res.json();
            if (error) throw new Error(error);
            return clientSecret;
          }
        });
        checkout.mount('#checkout-container');
      } catch (err) {
        errorEl.textContent = 'Não foi possível carregar o checkout. Tente novamente ou entre em contato: contato@estudiokata.com';
        errorEl.style.display = 'block';
      }
    })();
  </script>

</body>
</html>
