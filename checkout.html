<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição — Oficina de Estratégia · Estúdio Kata</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
    }
    #checkout-container {
      width: 50%;
    }
    @media (max-width: 768px) {
      body { justify-content: center; }
      #checkout-container { width: 100%; }
    }
    .co-error {
      display: none;
      padding: 16px;
      background: #fff0ee;
      border-left: 3px solid #e25c2e;
      font-size: 15px;
      line-height: 1.5;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div id="checkout-container"></div>
  <div class="co-error" id="checkout-error" role="alert"></div>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    (async () => {
      const errorEl = document.getElementById('checkout-error');
      try {
        const stripe = Stripe('pk_test_51TZGChA192J4BKrXXrWAkByWiomJtjU1AHgVSNOv9QNXL53k2ayWD70EVgMgUdLTCIzKxQJLT3Kbqh7vSx1fhvWX0022NYqPoF');
        const checkout = await stripe.initEmbeddedCheckout({
          fetchClientSecret: async () => {
            const res = await fetch('/api/checkout', { method: 'POST' });
            if (!res.ok) throw new Error();
            const { clientSecret, error } = await res.json();
            if (error) throw new Error(error);
            return clientSecret;
          }
        });
        checkout.mount('#checkout-container');
      } catch (err) {
        errorEl.textContent = 'Não foi possível carregar o checkout. Entre em contato: contato@estudiokata.com';
        errorEl.style.display = 'block';
      }
    })();
  </script>

</body>
</html>
